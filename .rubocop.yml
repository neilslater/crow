inherit_gem:
  ncs_rubocop_conf:
    - config/base.yml
    - config/rake.yml
    - config/rspec.yml
    - config/native_extension.yml

plugins:
  - rubocop-performance

# RuboCop rationale: Local agent guidance and ad-hoc probes are not repository source.
AllCops:
  Exclude:
    - 'docs/agent/**/*'
